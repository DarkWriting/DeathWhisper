name: Build Death Whisper
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get Gradle wrapper from NeoForge MDK
        run: |
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git /tmp/neoforge-mdk
          cp /tmp/neoforge-mdk/gradlew .
          mkdir -p gradle
          cp -R /tmp/neoforge-mdk/gradle/wrapper gradle/
          chmod +x gradlew
      - name: Compile
        run: ./gradlew build --stacktrace --no-daemon
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: death-whisper-jar
          path: build/libs/*.jar
